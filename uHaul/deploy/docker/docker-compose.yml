services:
  web:
    image: astropage-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://2026.synbioreactor.de}
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - MAUTIC_BASE_URL=${MAUTIC_BASE_URL:-}
      - MAUTIC_AUTH_TOKEN=${MAUTIC_AUTH_TOKEN:-}
      - BACKEND_SPONSOR_API_URL=${BACKEND_SPONSOR_API_URL:-}
    ports:
      - "4321:4321"
