services:
  web:
    image: astropage-web:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      # Optional: used by astro.config.mjs for sitemap
      # - SITE_URL=https://your-domain.example
    ports:
      - "4321:4321"
