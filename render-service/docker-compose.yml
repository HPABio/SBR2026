services:
  render-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # For local development, point to host machine's Astro dev server
      # Use host.docker.internal to access the host from within Docker
      - WEB_RENDER_ORIGIN=http://host.docker.internal:4321
    shm_size: '1gb'
